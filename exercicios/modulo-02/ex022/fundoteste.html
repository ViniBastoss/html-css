<head>

    <title>Teste de degradê CSS</title>
    <style>
        body{
            height: 100vh;
            background-size: 98%;
            background-image: url('imagens/wallpaper003.jpg');

        div.quadrado{

        div#q6{

            border-radius: 10px;
        }
